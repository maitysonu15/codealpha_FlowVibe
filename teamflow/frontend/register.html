<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — FlowVibe</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css?v=17.0">
  <link rel="stylesheet" href="css/responsive.css?v=17.0">
</head>
<body class="aurora-bg-wrap auth-page-container" style="background-color: #090D16; min-height: 100vh; padding: 2rem 1rem; box-sizing: border-box; display: flex; align-items: center; justify-content: center; overflow-y: auto;">

  <!-- Ambient Background Orbs -->
  <div class="aurora-orb aurora-orb-1" style="top: -120px; left: 15%;"></div>
  <div class="aurora-orb aurora-orb-2" style="bottom: -120px; right: 15%;"></div>

  <div class="auth-card-standalone" style="max-width: 680px; width: 100%; margin: auto; text-align: left; padding: 2.2rem 2.6rem; box-shadow: 0 35px 95px rgba(0, 0, 0, 0.92), 0 0 65px rgba(99, 102, 241, 0.4); border-radius: 24px; border: 1.5px solid rgba(255, 255, 255, 0.2); background: linear-gradient(165deg, rgba(21, 30, 51, 0.98) 0%, rgba(10, 15, 29, 0.99) 100%); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); box-sizing: border-box;">
    
    <!-- Top Header & Branding -->
    <div style="text-align: center; margin-bottom: 1.35rem;">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.65rem; display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none;">
        <div class="logo-mark" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(99, 102, 241, 0.45);">
          <svg width="44" height="44" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="reg-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366F1" />
                <stop offset="50%" stop-color="#8B5CF6" />
                <stop offset="100%" stop-color="#EC4899" />
              </linearGradient>
            </defs>
            <rect width="36" height="36" rx="10" fill="url(#reg-logo-bg)" />
            <path d="M0 10C0 4.47715 4.47715 0 10 0H26C31.5228 0 36 4.47715 36 10V18C36 18 24 12 0 18V10Z" fill="white" fill-opacity="0.25" />
            <rect x="0.5" y="0.5" width="35" height="35" rx="9.5" stroke="white" stroke-opacity="0.35" />
            <path d="M22.5 9.5L11.5 18H18L13.5 26.5L24.5 18H18L22.5 9.5Z" fill="#FFFFFF" />
            <circle cx="27" cy="9" r="2.2" fill="#38BDF8" />
            <circle cx="9" cy="27" r="2.2" fill="#F43F5E" />
          </svg>
        </div>
        <span style="font-size: 2rem; font-weight: 900; color: #FFFFFF; letter-spacing: -0.03em;">Flow<span class="gradient-text">Vibe</span></span>
      </a>
      <h1 style="font-size: 2.25rem; font-weight: 900; margin-bottom: 0.25rem; color: #FFFFFF; letter-spacing: -0.025em; line-height: 1.2;">Create your account</h1>
      <p class="text-secondary" style="font-size: 1.08rem; color: #CBD5E1; font-weight: 500; margin: 0; line-height: 1.45;">Start orchestrating projects with your team in real time</p>
    </div>

    <!-- Google Sign-Up Button (Firebase OAuth) -->
    <button type="button" id="btn-google-register" style="width: 100%; height: 50px; background: rgba(255, 255, 255, 0.09); border: 1.5px solid rgba(255, 255, 255, 0.22); border-radius: 12px; color: #FFFFFF; font-size: 1.08rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35); margin-bottom: 1rem;">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Sign up with Google (Firebase)</span>
    </button>

    <!-- Divider -->
    <div style="display: flex; align-items: center; gap: 0.85rem; margin: 0.85rem 0 1.05rem 0;">
      <div style="flex-grow: 1; height: 1px; background: rgba(255, 255, 255, 0.15);"></div>
      <span class="text-muted text-xs" style="text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.85rem; color: #CBD5E1; font-weight: 800;">or register with email</span>
      <div style="flex-grow: 1; height: 1px; background: rgba(255, 255, 255, 0.15);"></div>
    </div>

    <!-- Registration Form with Optimized 2-Column Grid -->
    <form id="register-form">
      
      <!-- Row 1: First Name & Last Name -->
      <div class="register-grid-2col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.95rem;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="reg-first-name" class="form-label" style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.35rem; display: block;">First Name</label>
          <input type="text" id="reg-first-name" class="form-input font-bold" placeholder="e.g. Maya" autocomplete="given-name" style="height: 48px; font-size: 1.1rem; font-weight: 600; border-radius: 12px; background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(255, 255, 255, 0.18); color: white; padding: 0.75rem 1.15rem; width: 100%; box-sizing: border-box;">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="reg-last-name" class="form-label" style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.35rem; display: block;">Last Name</label>
          <input type="text" id="reg-last-name" class="form-input font-bold" placeholder="e.g. Lin" autocomplete="family-name" style="height: 48px; font-size: 1.1rem; font-weight: 600; border-radius: 12px; background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(255, 255, 255, 0.18); color: white; padding: 0.75rem 1.15rem; width: 100%; box-sizing: border-box;">
        </div>
      </div>

      <!-- Row 2: Username & Email Address -->
      <div class="register-grid-2col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.95rem;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="reg-username" class="form-label" style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.35rem; display: block;">Username *</label>
          <div class="auth-input-wrapper" style="position: relative;">
            <span class="auth-input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #818CF8; pointer-events: none; display: flex;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="reg-username" class="form-input auth-input font-bold" placeholder="e.g. mayalin" required autocomplete="username" style="width: 100%; height: 48px; font-size: 1.1rem; font-weight: 600; padding-left: 3.1rem !important; border-radius: 12px; background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(255, 255, 255, 0.18); color: white; box-sizing: border-box;">
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="reg-email" class="form-label" style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.35rem; display: block;">Email Address *</label>
          <div class="auth-input-wrapper" style="position: relative;">
            <span class="auth-input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #818CF8; pointer-events: none; display: flex;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="reg-email" class="form-input auth-input font-bold" placeholder="name@company.com" required autocomplete="email" style="width: 100%; height: 48px; font-size: 1.1rem; font-weight: 600; padding-left: 3.1rem !important; border-radius: 12px; background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(255, 255, 255, 0.18); color: white; box-sizing: border-box;">
          </div>
        </div>
      </div>

      <!-- Row 3: Password & Confirm Password -->
      <div class="register-grid-2col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="reg-password" class="form-label" style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.35rem; display: block;">Password *</label>
          <div class="auth-input-wrapper" style="position: relative;">
            <span class="auth-input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #818CF8; pointer-events: none; display: flex;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="reg-password" class="form-input auth-input" placeholder="Min 6 characters" required autocomplete="new-password" style="width: 100%; height: 48px; font-size: 1.1rem; font-weight: 600; padding-left: 3.1rem !important; border-radius: 12px; background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(255, 255, 255, 0.18); color: white; box-sizing: border-box;">
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="reg-password-confirm" class="form-label" style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.35rem; display: block;">Confirm Password *</label>
          <div class="auth-input-wrapper" style="position: relative;">
            <span class="auth-input-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #818CF8; pointer-events: none; display: flex;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </span>
            <input type="password" id="reg-password-confirm" class="form-input auth-input" placeholder="Repeat password" required autocomplete="new-password" style="width: 100%; height: 48px; font-size: 1.1rem; font-weight: 600; padding-left: 3.1rem !important; border-radius: 12px; background: rgba(15, 23, 42, 0.92); border: 1.5px solid rgba(255, 255, 255, 0.18); color: white; box-sizing: border-box;">
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="register-submit-btn" class="nav-btn-signup" style="width: 100%; height: 54px; font-size: 1.22rem; font-weight: 900; border-radius: 14px; cursor: pointer; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 32px rgba(99, 102, 241, 0.55), inset 0 1.5px 2px rgba(255, 255, 255, 0.45); transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);">
        <span id="reg-btn-text">Create Account →</span>
      </button>
    </form>

    <!-- Highlighted Sign In Card -->
    <div style="margin-top: 1.15rem; padding: 1rem 1.35rem; background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(236, 72, 153, 0.15) 100%); border: 1.5px solid rgba(99, 102, 241, 0.45); border-radius: 14px; display: flex; align-items: center; justify-content: space-between; gap: 0.85rem; flex-wrap: wrap; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);">
      <div style="text-align: left;">
        <div style="font-size: 1.08rem; font-weight: 800; color: #FFFFFF;">Already have an account?</div>
        <div style="font-size: 0.95rem; color: #CBD5E1; margin-top: 2px; font-weight: 500;">Access your workspaces and boards</div>
      </div>
      <a href="login.html" class="nav-btn-signin" style="padding: 0.65rem 1.45rem; font-size: 1.02rem; font-weight: 800; text-decoration: none; border-radius: 10px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);">
        Sign In →
      </a>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/auth.js';
    import { firebaseAuthService } from './js/firebase-auth.js';
    import { showToast } from './js/api.js';

    // Redirect if already logged in
    auth.redirectIfAuth();

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('register-submit-btn');
    const btnText = document.getElementById('reg-btn-text');
    const googleBtn = document.getElementById('btn-google-register');

    // Google Sign-Up with Firebase
    if (googleBtn) {
      googleBtn.addEventListener('click', async () => {
        // Auto-switch to localhost:8000 if accessed via 127.0.0.1 (Firebase default authorized domain)
        if (window.location.hostname === '127.0.0.1') {
          const localhostUrl = window.location.href.replace('127.0.0.1', 'localhost');
          showToast('Switching to localhost:8000 for Google Sign-Up...', 'info');
          setTimeout(() => {
            window.location.href = localhostUrl;
          }, 350);
          return;
        }

        const originalText = googleBtn.innerHTML;
        googleBtn.disabled = true;
        googleBtn.innerHTML = '<span class="spinner" style="vertical-align: middle; margin-right: 8px;"></span> Connecting to Google...';

        try {
          const user = await firebaseAuthService.signInWithGoogle();
          if (user) {
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 400);
          } else {
            googleBtn.disabled = false;
            googleBtn.innerHTML = originalText;
          }
        } catch (err) {
          googleBtn.disabled = false;
          googleBtn.innerHTML = originalText;
          showToast(err.message || 'Google registration failed.', 'error');
        }
      });
    }

    // Email Registration
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const first_name = document.getElementById('reg-first-name').value.trim();
      const last_name = document.getElementById('reg-last-name').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const password_confirm = document.getElementById('reg-password-confirm').value;

      if (!username || !email || !password) {
        showToast('Please fill in all required fields.', 'warning');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters.', 'warning');
        return;
      }

      if (password !== password_confirm) {
        showToast('Passwords do not match.', 'warning');
        return;
      }

      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner" style="vertical-align: middle; margin-right: 8px;"></span> Creating account...';

      try {
        // Register user directly with Django backend
        await auth.register({
          username,
          email,
          password,
          password_confirm,
          first_name,
          last_name
        });

        // Optionally background-sync with Firebase if online
        try {
          if (window.location.hostname !== '127.0.0.1') {
            await firebaseAuthService.signUpWithEmail({
              email,
              password,
              username,
              first_name,
              last_name
            });
          }
        } catch (fbErr) {
          console.warn('Optional Firebase background sync notice:', fbErr);
        }

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } catch (err) {
        submitBtn.disabled = false;
        btnText.textContent = 'Create Account →';
      }
    });
  </script>
</body>
</html>
